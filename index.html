<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Boston Irish Dippers Tide Height (NOAA predictions)</title>

<link rel="icon" type="image/png" href="seahorse.png">
<link rel="apple-touch-icon" href="seahorse.png">

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin: 20px; background:#fff; color:#111; }
.header { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
.header img { height:52px; }
h1 { font-size:20px; margin:0; }

.card { background:#f6f6f6; padding:14px; border-radius:14px; margin-bottom:14px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
label { display:grid; gap:6px; font-size:13px; color:#666; }
input,button { font-size:14px; padding:10px 12px; border-radius:10px; border:1px solid #ddd; }
button { background:#111; color:#fff; cursor:pointer; }

.pill { display:inline-block; padding:3px 10px; border-radius:999px; background:#eee; font-size:12px; }

.plotWrap{ position:relative; height:420px; background:#fff; border-radius:12px; overflow:hidden; border:1px solid #ddd;}
#plot{ width:100%; height:100%; }
#overlay{ position:absolute; inset:0; z-index:10; touch-action:none; }

#hoverBox{
 position:fixed; z-index:9999; background:white;
 padding:10px 12px; border-radius:12px;
 box-shadow:0 6px 20px rgba(0,0,0,.15);
 border:1px solid rgba(0,0,0,.15);
 font-size:13px; pointer-events:none; display:none;
}

.tableWrap { max-height:350px; overflow:auto; background:#fff; border-radius:12px; border:1px solid #ddd;}
table { border-collapse:collapse; width:100%; min-width:680px;}
th,td{ padding:10px 12px; border-bottom:1px solid #eee; font-size:14px;}
th{ background:#fff; position:sticky; top:0;}

.kv{ display:grid; gap:8px; background:#fff; padding:10px 12px; border-radius:12px; border:1px solid #ddd; margin-top:10px;}
.kv .line{ display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>

<body>

<div class="header">
  <img src="seahorse.png">
  <h1>Boston Irish Dippers Tide Height (NOAA predictions)</h1>
</div>

<div class="card">
  <div class="row">
    <label>Date (Boston)
      <input id="date" type="date">
    </label>
  </div>

  <div class="kv">
    <div class="line"><b>Conditions:</b> <span id="condLine" class="pill">loading…</span></div>
    <div class="line"><b>Forecast:</b> <span id="wxLine" class="pill">loading…</span></div>
    <div class="line"><b>Selected:</b> <span id="selectedLine" class="pill">drag curve</span></div>
  </div>
</div>

<div class="card">
  <div class="plotWrap">
    <div id="plot"></div>
    <div id="overlay"></div>
  </div>
</div>

<div id="hoverBox"></div>

<div class="card">
  <h3>15-minute tide table (05:00 → 22:00)</h3>
  <div class="tableWrap">
    <table>
      <thead>
        <tr><th>Time</th><th>ft</th><th>m</th><th>% of max</th></tr>
      </thead>
      <tbody id="tideTableBody"></tbody>
    </table>
  </div>
</div>

<script>
const STATION="8443970", NOAA="https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
const NWS_LAT=42.3601, NWS_LON=-71.0589;

const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
const ftToM=f=>f*0.3048, fToC=f=>(f-32)*5/9;

async function fetchJSON(u){const r=await fetch(u);return await r.json();}

let CURVE=[], HILO=[], MAX=null;

async function loadDay(date){
  document.getElementById("date").value=date;
  const ymd=date.replace(/-/g,"");
  const base=`${NOAA}?application=boston-dippers&station=${STATION}&datum=MLLW&time_zone=lst_ldt&units=english&format=json`;

  CURVE=(await fetchJSON(`${base}&product=predictions&interval=6&begin_date=${ymd}&end_date=${ymd}`)).predictions
    .map(p=>({t:new Date(p.t),v:+p.v}));

  HILO=(await fetchJSON(`${base}&product=predictions&interval=hilo&begin_date=${ymd}&end_date=${ymd}`)).predictions
    .map(p=>({t:new Date(p.t),v:+p.v,type:p.type}));

  MAX=Math.max(...HILO.filter(x=>x.type==="H").map(x=>x.v));

  drawPlot();
  buildTable();
}

function tideAt(t){
  for(let i=0;i<CURVE.length-1;i++){
    let a=CURVE[i], b=CURVE[i+1];
    if(t>=a.t && t<=b.t){
      let w=(t-a.t)/(b.t-a.t);
      return a.v+w*(b.v-a.v);
    }
  }
  return CURVE[0].v;
}

function drawPlot(){
  const xs=CURVE.map(p=>p.t), ys=CURVE.map(p=>p.v);
  const start=new Date(xs[0].setHours(10,0,0,0));
  Plotly.newPlot("plot",[
    {x:xs,y:ys,mode:"lines"},
    {x:[start],y:[tideAt(start)],mode:"markers"}
  ],{
    dragmode:false,hovermode:false,
    shapes:[{type:"line",x0:start,x1:start,y0:0,y1:Math.max(...ys),line:{dash:"dot"}}]
  },{displayModeBar:false,staticPlot:true});

  installScrub();
}

function installScrub(){
  const overlay=document.getElementById("overlay"), box=document.getElementById("hoverBox");
  overlay.onpointermove=e=>{
    const r=overlay.getBoundingClientRect();
    const px=e.clientX-r.left;
    const frac=px/r.width;
    const t=new Date(CURVE[0].t.getTime()+frac*(CURVE.at(-1).t-CURVE[0].t));
    const v=tideAt(t);

    Plotly.relayout("plot",{"shapes[0].x0":t,"shapes[0].x1":t});
    Plotly.restyle("plot",{x:[[t]],y:[[v]]},[1]);

    box.style.display="block";
    box.style.left=`${e.clientX+15}px`;
    box.style.top=`${Math.max(8,e.clientY-80)}px`;
    box.innerHTML=`<b>${t.toLocaleTimeString()}</b><br>${v.toFixed(2)} ft (${ftToM(v).toFixed(2)} m)<br>${(100*v/MAX).toFixed(0)}% of max`;
    document.getElementById("selectedLine").textContent=box.textContent;
  }
}

function buildTable(){
  let tb=document.getElementById("tideTableBody");
  tb.innerHTML="";
  const d=CURVE[0].t;
  for(let h=5;h<=22;h++){
    for(let m=0;m<60;m+=15){
      const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);
      const v=tideAt(t);
      tb.innerHTML+=`<tr><td>${pad(h)}:${pad(m)}</td><td>${v.toFixed(2)}</td><td>${ftToM(v).toFixed(2)}</td><td>${(100*v/MAX).toFixed(0)}%</td></tr>`;
    }
  }
}

async function updateWeather(){
  const p=await fetchJSON(`https://api.weather.gov/points/${NWS_LAT},${NWS_LON}`);
  const h=await fetchJSON(p.properties.forecastHourly);
  const n=h.properties.periods[0];
  document.getElementById("wxLine").textContent=
    `${n.shortForecast} | ${n.temperature}°F | Wind ${n.windSpeed}`;
}

document.getElementById("date").onchange=e=>loadDay(e.target.value);
loadDay(today());
updateWeather();
</script>

</body>
</html>
