<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Boston Tide Height (NOAA)</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    :root { --fg:#111; --muted:#666; --bg:#fff; --card:#f6f6f6; --line:#e5e5e5; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; color: var(--fg); background: var(--bg); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    input, select, button { font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; background: #fff; }
    button { cursor: pointer; border: 1px solid #ccc; background: #111; color: #fff; }
    button.secondary { background:#fff; color:#111; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .card { background: var(--card); padding: 14px; border-radius: 14px; margin: 14px 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre-wrap; }
    .small { font-size: 13px; color: var(--muted); }
    .err { color: #b00020; white-space: pre-wrap; }

    .plotWrap{
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
    }
    #plot{ width:100%; height:100%; }

    /* Overlay blocks Plotly gestures + captures scrub */
    #overlay{
      position:absolute;
      inset:0;
      z-index: 10;
      background: rgba(0,0,0,0);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      cursor: crosshair;
    }

    /* FIX: use fixed so clientX/clientY positioning works everywhere */
    #hoverBox{
      position: fixed;
      z-index: 9999;
      min-width: 190px;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,0.18);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      pointer-events: none;
      display: none;
      font-size: 13px;
      line-height: 1.25;
    }
    #hoverBox .t { font-weight: 650; }
    #hoverBox .m { color: var(--muted); }

    .tableWrap {
      overflow: auto;
      background:#fff;
      border:1px solid var(--line);
      border-radius: 12px;
      max-height: 360px;
    }
    table { border-collapse: collapse; width: 100%; min-width: 420px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; font-size: 14px; }
    th { position: sticky; top: 0; background: #fff; z-index: 1; }
    td.monoCell { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; background:#eee; font-size:12px; color:#333; }
  </style>
</head>
<body>
  <h1>Boston Tide Height (NOAA predictions)</h1>

  <div class="card">
    <div class="row">
      <label>
        Date (Boston)
        <input id="date" type="date" />
      </label>
      <label>
        Time
        <input id="time" type="time" step="60" />
      </label>
      <label>
        Datum
        <select id="datum">
          <option value="MLLW" selected>MLLW (chart datum)</option>
          <option value="MSL">MSL</option>
          <option value="NAVD">NAVD</option>
        </select>
      </label>
      <label>
        Plot units
        <select id="units">
          <option value="english" selected>Feet</option>
          <option value="metric">Meters</option>
        </select>
      </label>
      <button id="btn">Get tide</button>
      <button id="jump" class="secondary" type="button">Jump to table ↓</button>
    </div>

    <div id="status" class="small" style="margin-top:10px;"></div>
    <div id="result" class="mono" style="margin-top:10px;"></div>
    <div id="error" class="err" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <div class="plotWrap">
      <div id="plot"></div>
      <div id="overlay" aria-label="Scrub overlay"></div>
    </div>
    <div class="small" style="margin-top:10px;">
      Drag to scrub (no zoom/selection). Tooltip shows ft + m.
    </div>
  </div>

  <!-- Hover box lives outside so fixed positioning works cleanly -->
  <div id="hoverBox"></div>

  <!-- TABLE: placed right after plot so it's hard to miss -->
  <div class="card" id="tableSection">
    <div class="row" style="justify-content: space-between;">
      <div>
        <div style="font-size:16px; font-weight:650;">15-minute table (05:00 → 22:00)</div>
        <div class="small" id="tableStatus">Table not generated yet.</div>
      </div>
      <div class="small"><span class="pill" id="tableCount">0 rows</span></div>
    </div>

    <div style="height:10px;"></div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Height (ft)</th>
            <th>Height (m)</th>
          </tr>
        </thead>
        <tbody id="tideTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ---------- Config ----------
    const STATION = "8443970";
    const NOAA = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
    const INTERVAL_MIN = 6;

    const TABLE_START_H = 5;
    const TABLE_END_H   = 22;
    const TABLE_STEP_MIN = 15;

    // State for scrubbing
    let CURRENT_PTS = [];
    let CURRENT_UNITS = "english";
    let CURRENT_YMIN = 0;
    let CURRENT_YMAX = 1;

    // ---------- Helpers ----------
    const pad2 = (n) => String(n).padStart(2, "0");
    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }
    function ymdCompact(isoDate) { return isoDate.replaceAll("-", ""); }

    function parseNOAATimeLocal(tStr) {
      const [d, hm] = tStr.split(" ");
      const [Y, M, D] = d.split("-").map(Number);
      const [h, m] = hm.split(":").map(Number);
      return new Date(Y, M - 1, D, h, m, 0, 0);
    }
    function toUserDateTime(isoDate, hhmm) {
      const [Y, M, D] = isoDate.split("-").map(Number);
      const [h, m] = hhmm.split(":").map(Number);
      return new Date(Y, M - 1, D, h, m, 0, 0);
    }
    function fmtLocal(dt) {
      const Y = dt.getFullYear();
      const M = pad2(dt.getMonth()+1);
      const D = pad2(dt.getDate());
      const h = pad2(dt.getHours());
      const m = pad2(dt.getMinutes());
      return `${Y}-${M}-${D} ${h}:${m}`;
    }

    function convertHeight(value, fromUnits, toUnits) {
      if (fromUnits === toUnits) return value;
      if (fromUnits === "english" && toUnits === "metric") return value * 0.3048;
      if (fromUnits === "metric" && toUnits === "english") return value / 0.3048;
      return value;
    }

    function linearInterpolate(t0, v0, t1, v1, t) {
      const x0 = t0.getTime(), x1 = t1.getTime(), x = t.getTime();
      if (x1 === x0) return v0;
      const w = (x - x0) / (x1 - x0);
      return v0 + w * (v1 - v0);
    }

    async function fetchNOAA(params) {
      const url = new URL(NOAA);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const resp = await fetch(url.toString());
      if (!resp.ok) throw new Error(`NOAA HTTP ${resp.status}`);
      const data = await resp.json();
      if (data.error) throw new Error(`NOAA error: ${data.error?.message || JSON.stringify(data.error)}`);
      return data;
    }

    async function fetchDayCurve({ isoDate, datum, units }) {
      const ymd = ymdCompact(isoDate);
      const data = await fetchNOAA({
        product: "predictions",
        application: "boston-tides-ghpages",
        station: STATION,
        begin_date: `${ymd} 00:00`,
        end_date: `${ymd} 23:59`,
        datum,
        time_zone: "lst_ldt",
        units,
        interval: String(INTERVAL_MIN),
        format: "json"
      });
      if (!data.predictions) throw new Error("No predictions returned.");
      return data.predictions
        .map(p => ({ tStr: p.t, t: parseNOAATimeLocal(p.t), v: Number(p.v) }))
        .sort((a,b) => a.t - b.t);
    }

    async function fetchDayHiLo({ isoDate, datum, units }) {
      const ymd = ymdCompact(isoDate);
      const data = await fetchNOAA({
        product: "predictions",
        application: "boston-tides-ghpages",
        station: STATION,
        begin_date: `${ymd} 00:00`,
        end_date: `${ymd} 23:59`,
        datum,
        time_zone: "lst_ldt",
        units,
        interval: "hilo",
        format: "json"
      });
      return (data.predictions || [])
        .map(p => ({ tStr: p.t, t: parseNOAATimeLocal(p.t), v: Number(p.v), type: p.type }))
        .sort((a,b) => a.t - b.t);
    }

    function tideAtTime(pts, target) {
      if (!pts.length) throw new Error("Empty predictions array.");

      if (target <= pts[0].t) return { t: target, v: pts[0].v, method: "clamped", trend: null };
      if (target >= pts[pts.length - 1].t) return { t: target, v: pts[pts.length - 1].v, method: "clamped", trend: null };

      let lo = 0, hi = pts.length - 1;
      while (lo + 1 < hi) {
        const mid = (lo + hi) >> 1;
        if (pts[mid].t <= target) lo = mid; else hi = mid;
      }
      const p0 = pts[lo], p1 = pts[hi];
      const v = linearInterpolate(p0.t, p0.v, p1.t, p1.v, target);
      const trend = (p1.v > p0.v) ? "rising" : (p1.v < p0.v ? "falling" : "flat");
      return { t: target, v, method: "interpolated", trend };
    }

    function findNextHiLo(hilo, target) {
      const next = hilo.find(x => x.t > target) || null;
      const prev = [...hilo].reverse().find(x => x.t <= target) || null;
      return { prev, next };
    }

    function setStatus(msg) { document.getElementById("status").textContent = msg; }
    function setError(err) { document.getElementById("error").textContent = String(err?.message || err); }

    // ---------- Table ----------
    function buildTable({ isoDate, pts, ptsUnits }) {
      const tbody = document.getElementById("tideTableBody");
      const status = document.getElementById("tableStatus");
      const count = document.getElementById("tableCount");

      tbody.innerHTML = "";
      status.textContent = "Generating table…";
      count.textContent = "0 rows";

      const [Y, M, D] = isoDate.split("-").map(Number);
      const start = new Date(Y, M - 1, D, TABLE_START_H, 0, 0, 0);
      const end   = new Date(Y, M - 1, D, TABLE_END_H, 0, 0, 0);

      const frag = document.createDocumentFragment();
      let n = 0;

      for (let t = new Date(start); t <= end; t = new Date(t.getTime() + TABLE_STEP_MIN * 60000)) {
        const at = tideAtTime(pts, t);
        const vFt = convertHeight(at.v, ptsUnits, "english");
        const vM  = convertHeight(at.v, ptsUnits, "metric");

        const tr = document.createElement("tr");

        const tdTime = document.createElement("td");
        tdTime.className = "monoCell";
        tdTime.textContent = `${pad2(t.getHours())}:${pad2(t.getMinutes())}`;

        const tdFt = document.createElement("td");
        tdFt.className = "monoCell";
        tdFt.textContent = vFt.toFixed(2);

        const tdM = document.createElement("td");
        tdM.className = "monoCell";
        tdM.textContent = vM.toFixed(2);

        tr.appendChild(tdTime);
        tr.appendChild(tdFt);
        tr.appendChild(tdM);
        frag.appendChild(tr);
        n++;
      }

      tbody.appendChild(frag);
      status.textContent = "Table generated.";
      count.textContent = `${n} rows`;
    }

    // ---------- Plot + scrub + tooltip ----------
    function plotDay({ pts, hilo, target, units }) {
      CURRENT_PTS = pts;
      CURRENT_UNITS = units;

      const xs = pts.map(p => p.t);
      const ys = pts.map(p => p.v);
      CURRENT_YMIN = Math.min(...ys);
      CURRENT_YMAX = Math.max(...ys);

      const hi = hilo.filter(x => x.type === "H");
      const lo = hilo.filter(x => x.type === "L");
      const at0 = tideAtTime(pts, target);

      const traces = [
        { x: xs, y: ys, mode: "lines", name: "Tide (predicted)" },
        { x: hi.map(p=>p.t), y: hi.map(p=>p.v), mode:"markers", name:"High", marker:{size:9, symbol:"triangle-up"} },
        { x: lo.map(p=>p.t), y: lo.map(p=>p.v), mode:"markers", name:"Low",  marker:{size:9, symbol:"triangle-down"} },
        { x: [target], y: [at0.v], mode:"markers", name:"Selected time", marker:{size:11, symbol:"circle"} }
      ];

      const layout = {
        margin: { l: 60, r: 20, t: 10, b: 60 },
        xaxis: { title: "Local time (Boston)", type: "date", fixedrange: true },
        yaxis: { title: `Height (${units === "metric" ? "m" : "ft"})`, fixedrange: true },
        legend: { orientation: "h", y: -0.25 },
        hovermode: false,
        dragmode: false,
        shapes: [
          {
            type: "line",
            x0: target, x1: target,
            y0: CURRENT_YMIN, y1: CURRENT_YMAX,
            xref: "x", yref: "y",
            line: { width: 2, dash: "dot" }
          }
        ]
      };

      Plotly.newPlot("plot", traces, layout, {
        responsive: true,
        displayModeBar: false,
        displaylogo: false,
        staticPlot: true
      });

      installScrub();
    }

    function installScrub() {
      const overlay = document.getElementById("overlay");
      const plotDiv = document.getElementById("plot");
      const hoverBox = document.getElementById("hoverBox");

      // RAF throttle for smoothness
      let lastX = null, lastY = null, rafPending = false;

      function showBox(clientX, clientY, dt, vFt, vM) {
        hoverBox.innerHTML =
          `<div class="t">${fmtLocal(dt)}</div>` +
          `<div>${vFt.toFixed(2)} ft</div>` +
          `<div class="m">${vM.toFixed(2)} m</div>`;
        hoverBox.style.display = "block";

        const pad = 12;
        let left = clientX + pad;
        let top  = clientY + pad;

        // keep on screen
        const rect = hoverBox.getBoundingClientRect();
        if (left + rect.width + 8 > window.innerWidth) left = clientX - rect.width - pad;
        if (top + rect.height + 8 > window.innerHeight) top = clientY - rect.height - pad;

        hoverBox.style.left = `${left}px`;
        hoverBox.style.top  = `${top}px`;
      }

      function hideBox() { hoverBox.style.display = "none"; }

      function doScrub(clientX, clientY) {
        if (!CURRENT_PTS.length || !plotDiv._fullLayout) return;

        const rect = overlay.getBoundingClientRect();
        const xpx = clientX - rect.left;

        const xaxis = plotDiv._fullLayout.xaxis;
        const xDate = new Date(xaxis.p2d(xpx));

        const minT = CURRENT_PTS[0].t;
        const maxT = CURRENT_PTS[CURRENT_PTS.length - 1].t;
        const clamped = new Date(Math.min(maxT.getTime(), Math.max(minT.getTime(), xDate.getTime())));

        const at = tideAtTime(CURRENT_PTS, clamped);
        const vFt = convertHeight(at.v, CURRENT_UNITS, "english");
        const vM  = convertHeight(at.v, CURRENT_UNITS, "metric");

        // Move cursor line + dot
        Plotly.relayout(plotDiv, {
          "shapes[0].x0": clamped,
          "shapes[0].x1": clamped
        });
        Plotly.restyle(plotDiv, { x: [[clamped]], y: [[at.v]] }, [3]);

        showBox(clientX, clientY, clamped, vFt, vM);
      }

      function schedule(clientX, clientY) {
        lastX = clientX; lastY = clientY;
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => {
          rafPending = false;
          doScrub(lastX, lastY);
        });
      }

      // Pointer events
      overlay.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        overlay.setPointerCapture?.(e.pointerId);
        schedule(e.clientX, e.clientY);
      }, { passive: false });

      overlay.addEventListener("pointermove", (e) => {
        e.preventDefault();
        schedule(e.clientX, e.clientY);
      }, { passive: false });

      overlay.addEventListener("pointerup", (e) => { e.preventDefault(); }, { passive: false });
      overlay.addEventListener("pointercancel", () => hideBox());
      overlay.addEventListener("pointerleave", () => hideBox());

      // iOS fallback touch events (more reliable on some Safari builds)
      overlay.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const t = e.touches[0];
        schedule(t.clientX, t.clientY);
      }, { passive: false });

      overlay.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const t = e.touches[0];
        schedule(t.clientX, t.clientY);
      }, { passive: false });

      overlay.addEventListener("touchend", () => { /* keep box; optional hide */ }, { passive: false });
    }

    // ---------- Main ----------
    const dateEl = document.getElementById("date");
    const timeEl = document.getElementById("time");
    const btn = document.getElementById("btn");
    const jump = document.getElementById("jump");

    dateEl.value = todayISO();
    timeEl.value = "10:00";

    jump.addEventListener("click", () => {
      document.getElementById("tableSection").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    btn.addEventListener("click", async () => {
      document.getElementById("error").textContent = "";
      setStatus("");
      btn.disabled = true;

      try {
        const isoDate = dateEl.value;
        const hhmm = timeEl.value;
        const datum = document.getElementById("datum").value;
        const units = document.getElementById("units").value;

        const target = toUserDateTime(isoDate, hhmm);

        setStatus("Fetching NOAA predictions…");
        const [pts, hilo] = await Promise.all([
          fetchDayCurve({ isoDate, datum, units }),
          fetchDayHiLo({ isoDate, datum, units })
        ]);

        const at = tideAtTime(pts, target);
        const { prev, next } = findNextHiLo(hilo, target);

        const vFt = convertHeight(at.v, units, "english");
        const vM  = convertHeight(at.v, units, "metric");

        const lines = [];
        lines.push(`Selected: ${fmtLocal(target)}`);
        lines.push(`Tide height: ${vFt.toFixed(2)} ft | ${vM.toFixed(2)} m (${at.method}${at.trend ? `, ${at.trend}` : ""})`);
        if (prev) {
          const pFt = convertHeight(prev.v, units, "english");
          const pM  = convertHeight(prev.v, units, "metric");
          lines.push(`Previous: ${prev.type === "H" ? "High" : "Low"} @ ${prev.tStr} → ${pFt.toFixed(2)} ft | ${pM.toFixed(2)} m`);
        }
        if (next) {
          const nFt = convertHeight(next.v, units, "english");
          const nM  = convertHeight(next.v, units, "metric");
          lines.push(`Next: ${next.type === "H" ? "High" : "Low"} @ ${next.tStr} → ${nFt.toFixed(2)} ft | ${nM.toFixed(2)} m`);
        }
        document.getElementById("result").textContent = lines.join("\n");

        plotDay({ pts, hilo, target, units });
        buildTable({ isoDate, pts, ptsUnits: units });

        setStatus("Done.");
      } catch (e) {
        setStatus("");
        setError(e);
      } finally {
        btn.disabled = false;
      }
    });

    // auto-run
    btn.click();
  </script>
</body>
</html>
